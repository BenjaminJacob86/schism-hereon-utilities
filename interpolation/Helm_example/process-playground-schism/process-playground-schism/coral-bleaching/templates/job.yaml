{{- $fullName := include "library-chart.fullname" . -}}

apiVersion: batch/v1
kind: Job

metadata:
  name: {{ .Release.Name }}
spec:
  template:
    spec:
      initContainers:
      - name: init-service
        image: busybox:1.28
        command: ['sh', '-c', "chown -R 1000:1000 /output-data"]
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
            limits:
              cpu: 50m
              memory: 50Mi
      - name: {{ .Release.Name }}-main-container
        image: docker.mercator-ocean.fr/moi-docker/bleaching:f6f771733e1caee5adac729a5b73a800921a59ce565f0d51b9edbda517fb7b06
        env:
        - name: SMALL_DEMO
          value: "{{ .Values.demo.smallDemo }}"
        - name: EDITO_INFRA_OUTPUT
          value: "/output-data"
        envFrom:
        {{- if .Values.copernicusMarine.enabled }}
        - secretRef:
            name: {{ include "library-chart.secretNameCopernicusMarine" . }}
        {{- end }}
        command: []
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
      - name: copy-output
        image: amazon/aws-cli
        envFrom:
        {{- if .Values.s3.enabled }}
        - secretRef:
            name: {{ include "library-chart.secretNameS3" . }}
        {{- end }}
        command: ["aws", "s3", "cp", "/output-data", "--endpoint-url", "https://$(AWS_S3_ENDPOINT)", "s3://{{ .Release.Namespace | replace "user-" "oidc-" }}/{{ .Release.Name }}", "--recursive"]
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
            {{- toYaml .Values.resources | nindent 12 }}
      restartPolicy: Never
      volumes:
      - emptyDir: {}
        name: temp-volume
  backoffLimit: 4
