{{- $fullName := include "library-chart.fullname" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
spec:
  template:
    spec:
      initContainers:
      - name: init-service
        image: busybox:1.28
        command: ['sh', '-c', "chown -R 1000:1000 /output-data"]
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
          limits:
            cpu: 50m
            memory: 50Mi

      - name: {{ .Release.Name }}-main
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: INPUT_S3_BUCKET
          value: "{{ .Values.processInputs.INPUT_S3_BUCKET }}"
        - name: INPUT_S3_PREFIX
          value: "{{ .Values.processInputs.INPUT_S3_PREFIX }}"
        - name: EDITO_INFRA_OUTPUT
          value: "{{ .Values.processInputs.EDITO_INFRA_OUTPUT }}"
        - name: INTERP_SURFACE_ONLY
          value: "{{ .Values.processOptions.INTERP_SURFACE_ONLY }}"
        - name: DO_CONVERT
          value: "{{ .Values.processOptions.DO_CONVERT }}"
        - name: MERGE
          value: "{{ .Values.processOptions.MERGE }}"
        - name: MERGE_OUTPUT
          value: "{{ .Values.processOptions.MERGE_OUTPUT }}"
        - name: DELETE_NC
          value: "{{ .Values.processOptions.DELETE_NC }}"
        - name: CHUNKS
          value: "{{ .Values.processOptions.CHUNKS }}"
        - name: NO_DEFAULT_CHUNKS
          value: "{{ .Values.processOptions.NO_DEFAULT_CHUNKS }}"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_SESSION_TOKEN
        - name: AWS_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_S3_ENDPOINT
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_DEFAULT_REGION
        - name: User_Name
          value: "{{ .Release.Namespace }}"
        command: []
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

      containers:
      - name: copy-output
        image: amazon/aws-cli
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_SESSION_TOKEN
        - name: AWS_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_S3_ENDPOINT
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets3
              key: AWS_DEFAULT_REGION
        command:
          - aws
          - s3
          - cp
          - /output-data
          - --endpoint-url
          - "https://$(AWS_S3_ENDPOINT)"
          - "s3://{{ .Release.Namespace | replace "user-" "oidc-" }}/{{- if .Values.processOutputs.outputPrefix -}}{{ .Values.processOutputs.outputPrefix }}{{ else }}{{ .Release.Name }}{{ end }}"
          - --recursive
        volumeMounts:
        - mountPath: /output-data
          name: temp-volume
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

      restartPolicy: Never
      volumes:
      - emptyDir: {}
        name: temp-volume
  backoffLimit: {{ .Values.job.backoffLimit }}

