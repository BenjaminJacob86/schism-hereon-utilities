# Metadata configuration for SCHISM interpolation scripts
# Contains variable definitions (names, units, standard names, long names, valid ranges)
# and global attributes for output NetCDF files

# Global attributes for output NetCDF files
# Note: 'history' and 'creation_date' are automatically generated by the script

global_attributes:

  title: >
    Statistical analysis results (mean and 95th percentile) of SCHISM v5.11.0
    simulation runs for the study:
    "Evaluation of seagrass as a nature-based solution for coastal protection
    in the German Wadden Sea under end-of-the-century sea level rise projections"

  summary: >
    This dataset contains statistically processed hydrodynamic model output
    (mean and 95th percentile) derived from SCHISM v5.11.0 simulations for the year 1997.
    The data form the quantitative basis of figures and analysis presented in
    Jacob et al. (2026).

  keywords: >
    seagrass, coastal protection, nature-based solutions,
    German Wadden Sea, German Bight,
    hydrodynamic modelling, sea level rise,
    SCHISM, statistical analysis

  conventions: "CF-1.8, ACDD-1.3"

  institution: "Helmholtz-Zentrum Hereon, Institute of Coastal Systems"

  creator_name: "Benjamin Jacob"
  creator_email: "Benjamin.Jacob@hereon.de"
  creator_institution: "Helmholtz-Zentrum Hereon"
  creator_type: "person"

  publisher_type: "institution"

  source: "SCHISM v5.11.0 model output"
  model: "SCHISM v5.11.0"

  processing_level: "Level 4 – statistically derived publication dataset"

  history: >
    Raw SCHISM v5.11.0 outputs generated at Deutsches Klimarechenzentrum (DKRZ)
    under project gg0028. Statistical post-processing (mean and 95th percentile)
    computed from hourly model output after spin-up removal for publication dataset.

  statistical_methods: >
    Temporal mean and 95th percentile calculated over the full analysis period
    (1997) from hourly hydrodynamic model output.

  time_coverage_start: "1997-01-01"
  time_coverage_end: "1997-12-31"
  sampling_frequency: "hourly"

  domain: "German Bight, German Wadden Sea"

  geospatial_lat_min: 53.0386
  geospatial_lat_max: 55.6287
  geospatial_lon_min: 5.1161
  geospatial_lon_max: 10.4048
  geospatial_lat_units: "degrees_north"
  geospatial_lon_units: "degrees_east"
  
  geospatial_vertical_units: "m"
  geospatial_vertical_positive: "up"

  spatial_ref: "EPSG:32632"
  geospatial_bounds_crs: "EPSG:4326"
  crs: "WGS84 / UTM zone 32N"

  license: "CC-BY-4.0"
  license_url: "https://spdx.org/licenses/CC-BY-4.0.html"

  acknowledgement: >
    This work used resources of the Deutsches Klimarechenzentrum (DKRZ),
    granted by its Scientific Steering Committee (WLA) under project gg0028
    "Anthropogenic and natural regional environmental change".

  contributor_name: "Deutsches Klimarechenzentrum (DKRZ)"
  contributor_role: "computational resources"
  contributor_project: "gg0028 – Anthropogenic and natural regional environmental change"

  references: "10.1007/s10236-026-01784-w"
  id: "DOI_of_dataset"

  version: "1.0"
  date_created: "2026-02-26"

